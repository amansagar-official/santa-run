<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="description" content="Santa Run - Jump, duck, collect gifts, use jetpack!" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>Santa Run</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; font-family: system-ui, -apple-system, sans-serif; }
    #game { display: block; width: 100%; height: 100%; touch-action: none; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }

    .hud {
      position: absolute; top: env(safe-area-inset-top, 12px); left: 14px; right: 14px;
      display: flex; justify-content: space-between; align-items: flex-start;
      color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); font-weight: 700; font-size: 18px;
    }
    .score-box {
      background: rgba(0,0,0,0.45); padding: 8px 14px; border-radius: 12px;
      backdrop-filter: blur(8px);
    }
    #pauseBtn {
      pointer-events: auto;
      background: rgba(0,0,0,0.5); border: 2px solid rgba(255,255,255,0.4);
      color: #fff; width: 44px; height: 44px; border-radius: 50%;
      font-size: 18px; font-weight: 800; cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #overlay, #pauseOverlay {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: rgba(6, 14, 28, 0.85); pointer-events: auto; transition: opacity 0.25s;
    }
    #overlay.hidden, #pauseOverlay.hidden { opacity: 0; pointer-events: none; }

    .title {
      font-size: clamp(36px, 10vw, 64px); font-weight: 900; color: #ff3b3b;
      text-shadow: 0 0 22px rgba(255,50,50,0.5), 3px 3px 0 #fff;
      letter-spacing: -1px; margin-bottom: 6px;
    }
    .subtitle { color: #d0e8ff; font-size: 15px; margin-bottom: 22px; text-align: center; }
    .btn {
      background: linear-gradient(180deg, #ff4d4d, #c41e1e); color: #fff; border: none;
      padding: 14px 42px; font-size: 20px; font-weight: 800; border-radius: 50px;
      box-shadow: 0 6px 0 #8b0000, 0 10px 22px rgba(0,0,0,0.4); pointer-events: auto;
      margin: 6px;
    }
    .btn.secondary {
      background: linear-gradient(180deg, #4a90d9, #2a5f9e);
      box-shadow: 0 6px 0 #1a3a6a, 0 10px 22px rgba(0,0,0,0.4);
    }
    .btn:active { transform: translateY(3px); }
    .highscore { margin-top: 18px; color: #ffd700; font-size: 16px; font-weight: 600; }
    .instructions {
      margin-top: 16px; color: #9ec4e8; font-size: 13px; text-align: center;
      line-height: 1.55; max-width: 300px;
    }
    .final-score { font-size: 28px; color: #fff; margin: 10px 0 6px; font-weight: 700; }

    .controls {
      position: absolute;
      bottom: max(16px, env(safe-area-inset-bottom));
      left: 0; right: 0;
      display: flex; justify-content: space-between;
      padding: 0 28px 10px;
      pointer-events: none;
    }
    .ctrl-btn {
      width: 74px; height: 74px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.55);
      color: #fff; font-size: 30px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
      backdrop-filter: blur(10px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    }
    .ctrl-btn:active { background: rgba(255,70,70,0.6); transform: scale(0.92); }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="hud">
      <div class="score-box">🎄 <span id="score">0</span></div>
      <button id="pauseBtn" title="Pause">❚❚</button>
      <div class="score-box">🏆 <span id="hiscore">0</span></div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="btnDown">↓</button>
      <button class="ctrl-btn" id="btnUp">↑</button>
    </div>

    <div id="overlay">
      <div class="title">SANTA RUN</div>
      <div class="subtitle">Endless Christmas Adventure</div>
      <button class="btn" id="startBtn">PLAY</button>
      <div class="highscore">Best: <span id="bestDisplay">0</span></div>
      <div class="instructions">
        ↑ Jump over snowmen<br>
        ↓ Duck under eagles<br>
        Collect ? / Jetpack for powers!
      </div>
    </div>

    <div id="pauseOverlay" class="hidden">
      <div class="title" style="font-size:42px">PAUSED</div>
      <button class="btn" id="resumeBtn">RESUME</button>
      <button class="btn secondary" id="quitBtn">QUIT</button>
    </div>
  </div>
  <script src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
